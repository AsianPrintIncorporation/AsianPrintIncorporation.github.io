<style>

  }

  .nav_buttons:hover {
    box-shadow: 10px 10px 10px rgb(150, 150, 175);
  }

  header {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding-bottom: 0px;
    border-bottom: 3px dashed azure;
  }

  .title {
    margin-bottom: 25px;
    margin-left: 25px;
    margin-right: 25px;
    font-size: 35px;
    border: solid;
    padding: 7px;
    font-weight: 900;
    height: 40px;
    width: 450px;
    align-items: center;
  }

  .nav_buttons_div {
    margin-right: auto;
    margin-left: auto;
    display: flex;
    gap: 40px;
    height: 50px;
  }

  .nav_buttons {
    height: 50px;
    font-size: 40px;
    cursor: pointer;
  }

  .nav_buttons_div a {
    display: contents;
  }
</style>
